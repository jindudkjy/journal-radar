name: 저널 트렌드 주간 갱신

on:
  schedule:
    - cron: "0 22 * * 0"   # 매주 월요일 07:00 KST (일요일 22:00 UTC)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # RSS 캐시 파일을 저장소에 저장하기 위해 필요
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 논문 수집 및 페이지 생성
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py
      - name: RSS 캐시 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rss_cache.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "RSS 캐시 갱신" && git push)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
